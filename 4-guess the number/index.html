<body>
    <div id="wrapper">
        <h1>Number Guessing Game</h1>
        <p>Try and guess a random number between 1-100.</p>
        <p>You have 10 attempts to guess the number.</p>
        <br>
        <form class="form">
            <label for="guessField" id="guess">Guess The Input</label>
                <input type="text"id="guessField" class="guessField">
                <input type="submit" id="subt" value="submit guess" class="submit">
             
        </form>
        <div class="resultParas"> 
<p> Previous Guesses : <span class="guess"></span></p>
<p > Guesses Remaining : <span class="lastresult">10</span></p>
<p class="lowOrHi"></p>
        </div>
         </div>
         <script src="script.js"></script>
</body>
